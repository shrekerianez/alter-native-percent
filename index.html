<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Проценты">
  <meta name="description" content="AlterNative — калькулятор процентов для iPhone на WebKit.">

  <title>Проценты · AlterNative</title>
  <link rel="manifest" href="./manifest.webmanifest?v=ios27-6">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=ios27-6">
  <link rel="icon" href="./icon.svg?v=ios27-6" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=ios27-6">

  <style>
    /* iOS 27.6 keyboard and touch-focus corrections. */
    .floating-toolbar {
      transition: opacity 160ms ease, transform 160ms ease, bottom 160ms ease, visibility 160ms step-end;
    }

    body.keyboard-open .floating-toolbar {
      bottom: calc(var(--safe-bottom) + 8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(18px) scale(0.985);
    }

    body.keyboard-open .privacy-note {
      visibility: hidden;
    }

    body.keyboard-open .app-shell {
      padding-bottom: calc(var(--safe-bottom) + 22px);
    }

    body.keyboard-open .toast {
      opacity: 0 !important;
      visibility: hidden;
    }

    .input-row {
      scroll-margin-top: calc(var(--safe-top) + 92px);
      scroll-margin-bottom: 24px;
    }

    html:not([data-input-modality="keyboard"]) .history-sheet .sheet-action:focus-visible,
    html:not([data-input-modality="keyboard"]) .history-sheet .history-item:focus-visible {
      outline: none;
      box-shadow: none;
    }

    html[data-input-modality="keyboard"] .history-sheet .sheet-action:focus-visible,
    html[data-input-modality="keyboard"] .history-sheet .history-item:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 62%, transparent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .floating-toolbar {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="navigation-bar glass-bar">
      <div class="navigation-title">
        <span class="eyebrow">AlterNative</span>
        <h1>Проценты</h1>
      </div>

      <button class="glass-control icon-button" id="resetButton" type="button" aria-label="Сбросить расчёт">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.4 7.7A8.2 8.2 0 1 1 3.8 13h2.1a6.1 6.1 0 1 0 1.3-3.8L9.8 12H3.5V5.7l1.9 2Z"/>
        </svg>
      </button>
    </header>

    <main class="content">
      <section class="form-group" aria-label="Параметры расчёта">
        <div class="form-row mode-row">
          <label for="modeSelect">Расчёт</label>
          <select id="modeSelect" class="mode-select" aria-label="Режим расчёта">
            <option value="subtract">Вычесть процент</option>
            <option value="add">Добавить процент</option>
            <option value="reverse">Найти сумму до вычета</option>
          </select>
        </div>

        <label class="form-row input-row" for="amountInput">
          <span class="row-copy">
            <span class="row-title" id="amountLabel">Сумма</span>
            <span class="row-detail" id="amountHint">Сумма до удержания процента</span>
          </span>
          <span class="value-editor">
            <input id="amountInput" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="100 000" aria-describedby="amountHint">
            <span class="value-suffix" aria-hidden="true">₽</span>
          </span>
        </label>

        <label class="form-row input-row" for="percentInput">
          <span class="row-copy">
            <span class="row-title">Процент</span>
            <span class="row-detail" id="percentHint">Например, комиссия агента</span>
          </span>
          <span class="value-editor percent-editor">
            <input id="percentInput" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="15" aria-describedby="percentHint">
            <span class="value-suffix" aria-hidden="true">%</span>
          </span>
        </label>
      </section>

      <div class="quick-percent" role="group" aria-label="Быстрый выбор процента">
        <button class="glass-control quick-button" type="button" data-percent="5">5%</button>
        <button class="glass-control quick-button" type="button" data-percent="6">6%</button>
        <button class="glass-control quick-button" type="button" data-percent="15">15%</button>
        <button class="glass-control quick-button" type="button" data-percent="20">20%</button>
      </div>

      <section class="result-section" aria-live="polite" aria-atomic="true">
        <div class="result-heading">
          <span id="resultLabel">После вычета</span>
          <span class="delta" id="resultBadge">− 0 ₽</span>
        </div>
        <output id="resultValue" class="result-value">0 ₽</output>
        <p id="resultCaption" class="result-caption">Укажите сумму и процент</p>
      </section>

      <p class="privacy-note">
        Расчёты и история хранятся только на этом устройстве.<br>
        <span aria-label="Версия приложения 27.6">AlterNative · версия 27.6</span>
      </p>
    </main>

    <nav class="floating-toolbar glass-bar" aria-label="Действия с расчётом">
      <button class="toolbar-button toolbar-primary" id="copyButton" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3Zm2 0h5a2 2 0 0 1 2 2v5h2V5h-9v2Zm5 2H5v10h10V9Z"/></svg>
        <span>Копировать</span>
      </button>

      <button class="toolbar-button" id="saveButton" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v16l-8-4-8 4V5a2 2 0 0 1 2-2Zm0 2v12.8l6-3 6 3V5H6Z"/></svg>
        <span>Сохранить</span>
      </button>

      <button class="toolbar-button" id="historyButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 1-7.4 5H2l3.2-3.2L8.4 9H6.7A6 6 0 1 0 12 6v3l4 2.3-1 1.7-5-2.9V4h2Z"/></svg>
        <span>История</span>
      </button>
    </nav>
  </div>

  <dialog class="history-sheet" id="historyDialog" aria-labelledby="historyTitle">
    <div class="sheet-shell">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <header class="sheet-header">
        <button class="sheet-action" id="clearHistoryButton" type="button">Очистить</button>
        <h2 id="historyTitle">История</h2>
        <button class="sheet-action" id="closeHistoryButton" type="button">Готово</button>
      </header>
      <div class="history-empty" id="historyEmpty">Сохранённых расчётов пока нет.</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </dialog>

  <div class="toast glass-bar" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
    (() => {
      'use strict';

      const root = document.documentElement;
      const body = document.body;
      const amount = document.getElementById('amountInput');
      const percent = document.getElementById('percentInput');
      const inputs = new Set([amount, percent]);
      const viewport = window.visualViewport;
      let keyboardOpen = false;
      let scrollTimer = 0;

      const activeNumericInput = () => inputs.has(document.activeElement);

      function viewportShowsKeyboard() {
        if (!viewport) return activeNumericInput();
        const reduction = Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop);
        return reduction > 120 || viewport.height < window.innerHeight * 0.82;
      }

      function keyboardIsVisible() {
        if (!viewport) return activeNumericInput();
        return viewportShowsKeyboard();
      }

      function revealActiveInput() {
        if (!activeNumericInput()) return;
        window.clearTimeout(scrollTimer);
        scrollTimer = window.setTimeout(() => {
          const row = document.activeElement.closest('.input-row');
          if (!row) return;
          const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
          row.scrollIntoView({ block: 'center', inline: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
        }, 90);
      }

      function syncKeyboard() {
        const open = keyboardIsVisible();
        if (open !== keyboardOpen) {
          keyboardOpen = open;
          body.classList.toggle('keyboard-open', open);
          root.toggleAttribute('data-keyboard-open', open);
        }
        if (open) revealActiveInput();
      }

      document.addEventListener('focusin', (event) => {
        if (!inputs.has(event.target)) return;
        window.setTimeout(syncKeyboard, 50);
        window.setTimeout(syncKeyboard, 180);
      });

      document.addEventListener('focusout', (event) => {
        if (!inputs.has(event.target)) return;
        window.setTimeout(syncKeyboard, 180);
        window.setTimeout(syncKeyboard, 360);
      });

      if (viewport) {
        viewport.addEventListener('resize', syncKeyboard, { passive: true });
        viewport.addEventListener('scroll', syncKeyboard, { passive: true });
      }
      window.addEventListener('resize', syncKeyboard, { passive: true });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Tab') root.setAttribute('data-input-modality', 'keyboard');
      }, true);

      const usePointerModality = () => root.setAttribute('data-input-modality', 'pointer');
      document.addEventListener('pointerdown', usePointerModality, true);
      document.addEventListener('touchstart', usePointerModality, { capture: true, passive: true });

      syncKeyboard();
    })();
  </script>
  <script src="./app.js?v=ios27-6" defer></script>
</body>
</html>
