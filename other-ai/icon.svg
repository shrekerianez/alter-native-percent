<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="52%" stop-color="#0055D4"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  
  <!-- Фон иконки -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Внутренняя стеклянная капсула (Liquid Glass) -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  
  <!-- Символ процента -->
  <line x1="168" y1="344" x2="344" y2="168" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
  <circle cx="182" cy="182" r="42" fill="none" stroke="#FFFFFF" stroke-width="32"/>
  <circle cx="330" cy="330" r="42" fill="none" stroke="#FFFFFF" stroke-width="32"/>
</svg>
